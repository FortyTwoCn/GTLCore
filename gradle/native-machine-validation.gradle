// Keep the native machine API check's dependency closure aligned with the production classes
// exercised by the recipe/world harness. Harness entrypoints and Additions sources stay separate.
file('migration/recipe-tests/build.gradle').eachLine { line ->
    def included = (line =~ /^\s*include '(org\/gtlcore\/gtlcore\/[^']+\.java)'\s*$/)
    if (included.matches() && !included.group(1).startsWith('org/gtlcore/gtlcore/migration/')) {
        sourceSets.nativeMachineApi.java.include(included.group(1))
    }
}
configurations.nativeMachineApiImplementation.extendsFrom(configurations.implementation)
configurations.nativeMachineApiCompileOnly.extendsFrom(configurations.compileOnly)
configurations.nativeMachineApiAnnotationProcessor.extendsFrom(configurations.annotationProcessor)
neoForge.addModdingDependenciesTo(sourceSets.nativeMachineApi)
tasks.named('compileNativeMachineApiJava') { dependsOn 'verifyGtceuBaseline' }
