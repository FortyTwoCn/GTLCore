pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
rootProject.name = 'gtlcore-native-recipe-tests'
dependencyResolutionManagement {
    versionCatalogs { forge { from(files('../../gradle/forge.versions.toml')) } }
}
def coreProperties = new Properties()
file('../../gradle.properties').withInputStream { coreProperties.load(it) }
includeBuild(file('../../' + coreProperties.getProperty('gtceu_source'))) {
    dependencySubstitution {
        substitute module('com.gregtechceu.gtceu:gtceu-1.21.1') using project(':')
    }
}
includeBuild('../dependencies/gtmthings') {
    name = 'gtmthings-native'
    dependencySubstitution {
        substitute module('com.hepdd.gtmthings:gtmthings') using project(':')
    }
}
