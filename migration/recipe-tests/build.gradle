neoForge {
    version = '21.1.248'
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    mods { gtlcore_recipe_test { sourceSet(sourceSets.main) } }
    runs {
        data {
            data()
            gameDirectory = file('run/data')
            programArguments.addAll('--mod', 'gtlcore_recipe_test', '--server',
                    '--output', file('build/generated-worldgen').absolutePath,
                    '--existing', file('src/main/resources').absolutePath)
            systemProperty 'mixin.debug.verify', 'true'
            systemProperty 'mixin.debug.strict.unique', 'true'
            systemProperty 'mixin.checks', 'true'
            environment 'TEST', 'true'
        }
        machineModelData {
            data()
            gameDirectory = file('run/machine-model-data')
            programArguments.addAll('--mod', 'gtlcore_recipe_test', '--client',
                    '--output', file('build/generated-machine-models').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing', file('../../src/main/resources').absolutePath,
                    '--existing-mod', 'gtceu', '--existing-mod', 'gtmthings', '--existing-mod', 'avaritia')
            environment 'TEST', 'true'
        }
        client {
            client()
            gameDirectory = file('run/client')
            systemProperty 'gtlcore.machineValidation.enabled', providers.gradleProperty('machineUiValidation').orElse('false').get()
            systemProperty 'gtlcore.rendererValidation.enabled', providers.gradleProperty('rendererValidation').orElse('false').get()
            systemProperty 'gtlcore.itemMenusValidation.enabled', providers.gradleProperty('itemMenusValidation').orElse('false').get()
            systemProperty 'gtlcore.maintenanceValidation.enabled', providers.gradleProperty('maintenanceValidation').orElse('false').get()
            systemProperty 'gtlcore.previewValidation.enabled', providers.gradleProperty('previewValidation').orElse('false').get()
            systemProperty 'gtlcore.modeValidation.enabled', providers.gradleProperty('modeValidation').orElse('false').get()
