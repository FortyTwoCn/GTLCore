tasks.register('verifyNativeWorld') {
    group = 'verification'
    description = 'Requires completed native GameTests and rejects loader or sync errors, even when Java exits normally.'
    dependsOn 'runGameTestServer'
    doLast {
        def log = file('run/gametest/logs/latest.log')
        if (!log.exists()) throw new GradleException('Native world validation produced no Minecraft log')
        def contents = log.getText('UTF-8')
        def expected = fileTree('src/main/java/org/gtlcore/gtlcore/migration') {
            include '*GameTests.java'
        }.sum { (it.getText('UTF-8') =~ /@GameTest\(/).count }
        if (!contents.contains("All ${expected} required tests passed")) {
            throw new GradleException('Native world startup/test completion was not confirmed; inspect run/gametest/logs/latest.log')
        }
        if (contents.contains('Sync: Error') || contents.contains('Sync: failed to') || contents.contains('ModLoadingException') ||
                contents.contains('MixinApplyError') || contents.contains('InvalidInjectionException')) {
            throw new GradleException('Native world validation logged a loader, mixin or sync failure')
        }
    }
}

