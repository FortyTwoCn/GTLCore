// Generate with the production NeoForge provider and compare complete codec output to the shipped datapack.
tasks.register('verifyNativeWorldgenData') {
    group = 'verification'
    dependsOn tasks.named('runData')
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def manifest = parser.parse(file('../bedrock-fluids.json'))
        def generated = file('build/generated-worldgen/data/gtceu/gtceu/bedrock_fluid')
        def shipped = file('../../src/main/resources/data/gtceu/gtceu/bedrock_fluid')
        def expected = manifest.entries.collect { it.id.split(':')[1] + '.json' }.toSet()
        def found = generated.listFiles()?.findAll { it.name.endsWith('.json') }?.collect { it.name }?.toSet()
        if (found != expected) throw new GradleException("Native bedrock fluid generation differs: expected=${expected}, found=${found}")
        expected.each { name ->
            if (parser.parse(new File(generated, name)) != parser.parse(new File(shipped, name))) {
                throw new GradleException("Native bedrock fluid generated settings differ from the production resource: ${name}")
            }
        }
        logger.lifecycle('GTL_NATIVE_WORLDGEN_DATA=PASS deposits=30 production_provider=true unchanged_settings=true')
    }
}

