pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
dependencyResolutionManagement {
    versionCatalogs {
        libs { from(files('../../../gradle/libs.versions.toml')) }
        forge { from(files('../../../gradle/forge.versions.toml')) }
    }
}
rootProject.name = 'ae2jei-native'
includeBuild('../ae2wtlib') {
    dependencySubstitution {
        substitute module('maven.modrinth:applied-energistics-2-wireless-terminals') using project(':')
        substitute module('de.mari_023:ae2wtlib_api') using project(':ae2wtlib_api')
    }
}
