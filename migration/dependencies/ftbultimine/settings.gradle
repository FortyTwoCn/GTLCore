pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
dependencyResolutionManagement {
    versionCatalogs {
        libs { from(files('../../../gradle/libs.versions.toml')) }
        forge { from(files('../../../gradle/forge.versions.toml')) }
    }
}
rootProject.name = 'ftbultimine-native'
includeBuild('../ftbranks') {
    dependencySubstitution {
        substitute module('dev.ftb.mods:ftb-ranks-neoforge') using project(':')
    }
}
